seoTitle: 'Dunkle Creek: Hocking Hills A-frame cabin with a hot tub'
seoDescription: Dunkle Creek is a cozy Hocking Hills A-frame cabin near McArthur, Ohio, 15 minutes from Ash Cave. Sleeps 6, with a hot tub, fire pit, game room and pool.
blurb: A cozy black Hocking Hills A-frame cabin for 6, 15 minutes from Ash Cave. Soak in the hot tub, light the fire pit and let the woods do the rest.
aboutHeading: An A-frame cabin in Ohio, made for slowing down
about: |-
  Dunkle Creek is a black Hocking Hills A-frame cabin in McArthur, Ohio, 15 minutes from Ash Cave and 20 to 30 minutes from the other main trails. It sleeps 6 across 2 bedrooms and 2.5 baths.

  This is the one for slowing down. Soak in the hot tub on a crisp night, circle up at the fire pit in the woods and watch the hills change color in the fall.
aboutMore: |-
  Inside there are 2 electric fireplaces, 2 65-inch smart TVs and a basement game room with shuffleboard and board games. The kitchen is fully stocked, and Wi-Fi and a dedicated workspace make midweek stays easy.

  The A-frame has several levels, with flights of stairs between them. The king bedroom is in the top-floor loft, and the pool is open May 15 to October 15.
