faqs:
  - q: How many people does Dunkle Creek sleep?
    a: '6 guests across 2 bedrooms: a king bed in the top-floor loft, and a queen bed with built-in bunk beds in the basement. There are 2.5 baths.'
  - q: How close is Dunkle Creek to Ash Cave?
    a: About 15 minutes. The other main Hocking Hills trails are 20 to 30 minutes away.
  - q: Is Dunkle Creek an A-frame cabin?
    a: Yes. It's a black A-frame with tall windows, exposed beams and a king bedroom in the top-floor loft. The levels are linked by flights of stairs.
  - q: Is the pool heated?
    a: No. The pool is open May 15 to October 15. The hot tub is open all year.
  - q: Is there cell service?
    a: It can be spotty. The cabin has Wi-Fi, so save the password before you arrive and turn on Wi-Fi calling.
  - q: What time are check-in and check-out?
    a: Check-in is 4:00 pm and check-out is 11:00 am.
  - q: Is there a minimum stay?
    a: 2 nights. Holiday and peak-season stays may need 3.
  - q: What is the cancellation policy?
    a: Full refund up to 60 days before check-in and 50% up to 30 days before. After that, stays are non-refundable.
