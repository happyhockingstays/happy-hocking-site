seoTitle: 'Rickenbacker Ridge: Hocking Hills cabin with a heated pool'
seoDescription: Rickenbacker Ridge is a Hocking Hills cabin in Sugar Grove, Ohio on 20 private wooded acres. Sleeps 13, with a heated pool, hot tub and game room. Book direct.
blurb: 20 wooded acres and no neighbors in sight. Rickenbacker Ridge sleeps 13, with a heated pool, a hot tub for 6 and a game room for rainy afternoons.
about: |-
  Rickenbacker Ridge is a Hocking Hills cabin on 20 private acres in Sugar Grove, Ohio. It sleeps 13 across 4 bedrooms, 15 minutes from Logan and Lancaster and 30 minutes from the Hocking Hills State Park trails.

  The woods wrap all the way around, so the only people you'll see are the ones you brought. The pool is heated to about 80°F and open May 15 to October 15.
aboutMore: |-
  Evenings belong to the hot tub, the fire pit (firewood provided) and the bench swing. Downstairs, the finished basement has a TV, foosball, air hockey and board games.

  The kitchen is fully equipped, with coffee provided. Starlink Wi-Fi keeps up with streaming and video calls. Kids love the bunk room, with its secret loft for reading and naps.
