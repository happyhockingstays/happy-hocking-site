goodToKnow:
  - The driveway is gravel and steep in one spot. AWD or 4WD is recommended in snow
  - Message us before a snowy stay and we'll help you plan
  - There's plenty of flat parking at the bottom of the driveway
faqs:
  - q: Is the pool heated?
    a: Yes. The pool is heated to about 80°F and open May 15 to October 15.
  - q: How private is Rickenbacker Ridge?
    a: Very. The cabin sits on 20 wooded acres with no neighbors in sight.
  - q: How many people does Rickenbacker Ridge sleep?
    a: '13 guests across 4 bedrooms: a king suite, a king and twin room, a bunk room with 2 twin-over-queen bunk beds and a sofa bed room. There are 2.5 baths.'
  - q: Do I need 4WD to get there?
    a: The gravel driveway is steep in one spot. AWD or 4WD is recommended in snow. Message us before a snowy stay and we'll help you plan.
  - q: What time are check-in and check-out?
    a: Check-in is 4:00 pm and check-out is 11:00 am.
  - q: Is there a minimum stay?
    a: 2 nights. Holiday and peak-season stays may need 3.
  - q: What is the cancellation policy?
    a: Full refund up to 60 days before check-in and 50% up to 30 days before. After that, stays are non-refundable.
