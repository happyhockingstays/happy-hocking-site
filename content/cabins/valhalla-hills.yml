seoTitle: 'Valhalla Hills: Hocking Hills cabin with a pool, sleeps 29'
seoDescription: Valhalla Hills is a hilltop Hocking Hills estate in Lancaster, Ohio that sleeps 29. Saltwater pool, 8-person hot tub, sauna and 2 kitchens. Book direct.
blurb: A hilltop estate with room for 29. Swim in the saltwater pool, soak in the 8-person hot tub, then spread out across 8,000 square feet, 2 kitchens and 11 bedrooms.
about: |-
  Valhalla Hills is a Hocking Hills cabin on a quiet hilltop in Lancaster, Ohio, about 45 minutes from Columbus and 20 to 30 minutes from the Hocking Hills trails. It sleeps 29 across 11 bedrooms, with more than 8,000 square feet to share.

  It's built for the big ones: reunions, milestone birthdays and whole-family weeks. 2 full kitchens keep breakfast for 29 moving, and the kids get their own bunk room.
aboutMore: |-
  Outside, the saltwater pool, the 8-person hot tub and the fire pit sit by a huge patio deck, with a propane grill and plenty of seating. Inside there are multiple living areas, a 3-person sauna, a pool table and ping pong.

  8 bedrooms have king beds. A bunk room sleeps 6, a loft has 4 twin beds and a hallway bunk sleeps 2. There's parking for 10 to 14 cars, so everyone can drive in.
