faqs:
  - q: How many people does Valhalla Hills sleep?
    a: '29 guests across 11 bedrooms: 8 with king beds, a bunk room for 6, a loft with 4 twin beds and a hallway bunk for 2. There are 6 full baths.'
  - q: Is the pool heated?
    a: No. The saltwater pool is open May 15 to October 15. The 8-person hot tub and the sauna are there all year.
  - q: How far is Valhalla Hills from the Hocking Hills trails?
    a: About 20 to 30 minutes to the Hocking Hills region, and about 45 minutes from Columbus.
  - q: Can we host a party or event?
    a: Valhalla Hills is for overnight groups of up to 29. Parties and events aren't allowed, and outdoor quiet hours run 9:00 pm to 9:00 am with no outdoor speakers.
  - q: What time are check-in and check-out?
    a: Check-in is 4:00 pm and check-out is 10:00 am.
  - q: Is there a minimum stay?
    a: 2 nights. Holiday and peak-season stays may need 3.
  - q: What is the cancellation policy?
    a: Full refund up to 90 days before check-in and 50% up to 60 days before. After that, stays are non-refundable.
