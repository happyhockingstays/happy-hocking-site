seoTitle: 'Pickle Hill: Hocking Hills cabin with a pickleball court'
seoDescription: Pickle Hill is a Hocking Hills cabin in Logan, Ohio with a regulation pickleball court in its own barn. Sleeps 10, with a pool, hot tub and sauna. Book direct.
blurb: A regulation pickleball court in its own barn, 5 minutes from downtown Logan. Play a few games, jump in the saltwater pool, then warm up in the sauna.
about: |-
  Pickle Hill is a Hocking Hills cabin in Logan, Ohio with one of the only regulation-size pickleball courts in the area. It sleeps 10 across 5 bedrooms, 5 minutes from downtown Logan and 20 to 30 minutes from the trails.

  The court sits in its own enclosed barn on 3 acres, so the game goes on rain or shine. Paddles down, the saltwater pool and hot tub are waiting.
aboutMore: |-
  There's more to play: ping pong, a basketball hoop, cornhole, Spikeball and KanJam. When it's time to slow down, there's an infrared sauna, a fire pit with firewood provided and a finished basement with a TV.

  The kitchen has a coffee bar with specialty syrups and to-go cups, plus an air fryer and everything you need to cook for 10. The barn is covered but not heated or cooled, so dress for the season.
