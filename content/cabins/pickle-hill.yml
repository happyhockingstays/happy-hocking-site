faqs:
  - q: Is the pickleball court indoors?
    a: Yes. It's a full-size regulation court inside an enclosed barn, so you can play in any weather. The barn isn't heated or cooled.
  - q: How many people does Pickle Hill sleep?
    a: 10 guests across 5 bedrooms, with 2 king beds, 2 queen beds and a pair of twins. There are 2 full baths.
  - q: Is the pool heated?
    a: No. The saltwater pool is open May 15 to October 15. The hot tub and infrared sauna are there all year.
  - q: How far is Pickle Hill from the Hocking Hills trails?
    a: About 20 to 30 minutes. Downtown Logan is 5 minutes away.
  - q: What time are check-in and check-out?
    a: Check-in is 4:00 pm and check-out is 11:00 am.
  - q: Is there a minimum stay?
    a: 2 nights. Holiday and peak-season stays may need 3.
  - q: What is the cancellation policy?
    a: Full refund up to 60 days before check-in and 50% up to 30 days before. After that, stays are non-refundable.
