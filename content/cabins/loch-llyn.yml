seoTitle: 'Loch Llyn: Hocking Hills cabin for 29 with a private lake'
seoDescription: Loch Llyn is a Hocking Hills estate in Logan, Ohio on 130 acres with a private 2-acre lake. Sleeps 29, with a pool, 8-person hot tub and 2 kitchens. Book direct.
blurb: 130 acres, a private 2-acre lake and 11,000 square feet for your group of 29. Paddle out in the morning, hike your own trails, then meet at the hot tub.
about: |-
  Loch Llyn is one of the largest private homes in the Hocking Hills, on 130 acres in Logan, Ohio. It sleeps 29 across 10 bedrooms and sits 20 to 30 minutes from the main trails.

  It's really 2 homes in 1: a log cabin side and a renovated newer side, joined by a hallway. Your group gets both, plus the lake, the trails and the pool.
aboutMore: |-
  The private 2-acre lake is stocked with fish, with kayaks and paddleboards ready to go. It's about 75 steps down from the house, and worth every one.

  Back up top there's a new pool, an 8-person hot tub, a huge patio deck and a propane grill. Inside you'll find 3 living rooms, 2 full kitchens, a dining table that seats 20, a pool table, ping pong and an Xbox. There's parking for 12 to 15 cars.
