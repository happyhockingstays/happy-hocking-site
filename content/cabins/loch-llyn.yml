faqs:
  - q: How many people does Loch Llyn sleep?
    a: '29 guests across 10 bedrooms: 8 with king beds, a kids bunk room that sleeps 10 and a loft that sleeps 3. There are 5 full baths and 2 half baths.'
  - q: Can we use the lake?
    a: Yes. The 2-acre lake is private to your group. It's stocked with fish, and kayaks and paddleboards are provided. It's about 75 steps down from the house.
  - q: Is the pool heated?
    a: No. The pool is open May 15 to October 15. The 8-person hot tub is open all year.
  - q: How far is Loch Llyn from the Hocking Hills trails?
    a: About 20 to 30 minutes, and there are hiking trails on the property too.
  - q: What time are check-in and check-out?
    a: Check-in is 4:00 pm and check-out is 10:00 am.
  - q: Is there a minimum stay?
    a: 2 nights. Holiday and peak-season stays may need 3.
  - q: What is the cancellation policy?
    a: Full refund up to 90 days before check-in and 50% up to 60 days before. After that, stays are non-refundable.
