faqs:
  - q: Can we use the pond?
    a: Yes. The 2-acre pond is private to the cabin, and kayaks are provided. We send a short waiver about 7 days before check-in.
  - q: Why is it called The Johnny?
    a: The cabin is inspired by music legend Johnny Cash, and you'll spot him in the decor.
  - q: How many people does The Johnny sleep?
    a: '16 guests across 6 bedrooms: a king and 3 queens on the first floor, plus 2 open lofts with a king bed and 6 twin beds. There are 2.5 baths.'
  - q: Is the pool heated?
    a: No. The pool is open May 15 to October 15. The hot tub is open all year.
  - q: What time are check-in and check-out?
    a: Check-in is 4:00 pm and check-out is 11:00 am.
  - q: Is there a minimum stay?
    a: 2 nights. Holiday and peak-season stays may need 3.
  - q: What is the cancellation policy?
    a: Full refund up to 60 days before check-in and 50% up to 30 days before. After that, stays are non-refundable.
