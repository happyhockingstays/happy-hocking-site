seoTitle: 'The Johnny: Hocking Hills cabin with a private pond'
seoDescription: The Johnny is a Johnny Cash-inspired Hocking Hills cabin in Laurelville, Ohio. Sleeps 16, with a private 2-acre pond, kayaks, pool and hot tub. Book direct.
blurb: A Johnny Cash-inspired log cabin for 16 with a private 2-acre pond. Kayak in the morning, swim in the afternoon and end the day at the fire pit.
about: |-
  The Johnny is a Hocking Hills cabin in Laurelville, Ohio, inspired by music legend Johnny Cash. It sleeps 16 across 6 bedrooms, 20 to 30 minutes from the trails.

  The back deck looks over a private 2-acre pond, and the kayaks are yours to use. Add a hot tub, a seasonal pool and a fire pit, and it's easy to recharge here.
aboutMore: |-
  The cabin sits on 3.5 wooded acres, with a huge open yard and a covered front porch for morning coffee. Fall is a favorite: the trees around the pond put on a show.

  Inside, the kitchen and living room share an open layout under log beams, with an indoor gas fireplace and fast Starlink Wi-Fi. 4 bedrooms are on the first floor, and 2 open lofts sleep 8 more.
