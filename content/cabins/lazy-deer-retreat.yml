faqs:
  - q: How close is Lazy Deer to Old Man's Cave?
    a: About 5 minutes, so you can be on the trails early and back for the hot tub by afternoon.
  - q: Is there a sauna?
    a: Yes, a private 2-person sauna in the primary suite.
  - q: Is the pool heated?
    a: No. The pool is open May 15 to October 15. The hot tub and sauna are there all year.
  - q: How many people does Lazy Deer sleep?
    a: '8 guests across 3 bedrooms: a king suite, a queen bedroom and a bunk room with 2 bunk beds. There are 2 full baths.'
  - q: What time are check-in and check-out?
    a: Check-in is 4:00 pm and check-out is 11:00 am.
  - q: Is there a minimum stay?
    a: 2 nights. Holiday and peak-season stays may need 3.
  - q: What is the cancellation policy?
    a: Full refund up to 60 days before check-in and 50% up to 30 days before. After that, stays are non-refundable.
