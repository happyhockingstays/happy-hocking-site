seoTitle: 'Lazy Deer Retreat: Hocking Hills cabin near Old Man''s Cave'
seoDescription: Lazy Deer Retreat is a new Hocking Hills cabin in Logan, Ohio, 5 minutes from Old Man's Cave. Sleeps 8, with a pool, hot tub, sauna and sport court. Book direct.
blurb: 'Our newest cabin, 5 minutes from Old Man''s Cave. Hike in the morning, then pick your way to unwind: the pool, the hot tub or the private sauna.'
about: |-
  Lazy Deer Retreat is our newest Hocking Hills cabin in Logan, Ohio, and the closest to the trails: about 5 minutes from Old Man's Cave. It sleeps 8 across 3 bedrooms and 2 baths.

  After a day on the trails, there's a pool with a big deck, a hot tub for 5 to 6 and a private 2-person sauna in the primary suite.
aboutMore: |-
  The sport court is ready for pickleball and basketball, and the game room has a 75-inch TV, shuffleboard, arcade games and a chess set. Outside, Adirondack chairs circle the fire pit and the propane grill is ready to go.

  The kitchen and living room share an open layout, with an induction stovetop and both Keurig and drip coffee. Starlink Wi-Fi is fast, and there's an EV charger on site.
