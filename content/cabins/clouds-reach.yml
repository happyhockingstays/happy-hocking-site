seoTitle: 'Clouds Reach: Hocking Hills cabin with a heated pool'
seoDescription: Clouds Reach is a Hocking Hills cabin in Logan, Ohio that sleeps 16. Heated saltwater pool open April 15 to November 30, hot tub, bocce and fire pit. Book direct.
blurb: A hillside home for 16 on 3.5 acres. The saltwater pool is heated to 85°F and open April 15 to November 30, and the stars come out big after dark.
about: |-
  Clouds Reach is a Hocking Hills cabin on 3.5 hillside acres in Logan, Ohio. It sleeps 16 across 4 bedrooms and 4 full baths, 15 minutes from downtown Logan and 20 to 30 minutes from the trails.

  The pool is the headline: saltwater, heated to about 85°F and open April 15 to November 30, the longest season of any of our cabins.
aboutMore: |-
  Around it you'll find a hot tub, a bocce court, a covered gazebo and a fire pit with room for everyone. A three-seasons room and a deck with Adirondack chairs look out over the property.

  Inside, the kitchen and living room share an open layout. The first-floor primary suite has a king bed, a soaking tub and a walk-in closet, and the basement bunk room sleeps 8.
