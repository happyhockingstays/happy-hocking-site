faqs:
  - q: Is the pool heated?
    a: Yes. The saltwater pool is heated to about 85°F and open April 15 to November 30, the longest pool season of our cabins.
  - q: How many people does Clouds Reach sleep?
    a: '16 guests across 4 bedrooms: 3 bedrooms with king beds and a basement bunk room that sleeps 8. There are 4 full baths.'
  - q: Is the hot tub open all year?
    a: Yes. It seats 4 to 5 and is open all year.
  - q: How far is Clouds Reach from the Hocking Hills trails?
    a: About 20 to 30 minutes. Downtown Logan is 15 minutes away.
  - q: What time are check-in and check-out?
    a: Check-in is 4:00 pm and check-out is 11:00 am.
  - q: Is there a minimum stay?
    a: 2 nights. Holiday and peak-season stays may need 3.
  - q: What is the cancellation policy?
    a: Full refund up to 60 days before check-in and 50% up to 30 days before. After that, stays are non-refundable.
