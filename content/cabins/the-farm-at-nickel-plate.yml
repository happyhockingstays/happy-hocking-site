seoTitle: 'The Farm at Nickel Plate: Hocking Hills sports barn cabin'
seoDescription: The Farm at Nickel Plate is a Hocking Hills home in Logan, Ohio that sleeps 22. Sports barn, basement game room, private pool and hot tub. Book direct.
blurb: A hilltop home for 22 with its own sports barn. Play basketball, pickleball or soccer, cool off in the pool, then settle the score in the basement game room.
about: |-
  The Farm at Nickel Plate is a 6,000 square foot Hocking Hills home on a hilltop in Logan, Ohio. It sleeps 22 across 8 bedrooms, 10 minutes from downtown Logan and 20 to 30 minutes from the trails.

  It's made for groups that like to stay busy. The sports barn handles basketball, pickleball and soccer in any weather, and the pool and hot tub handle the rest.
aboutMore: |-
  Downstairs, the game room has a pool table, air hockey, foosball, ping pong and video games. Outside there's a fire pit with long views, a swing set, a propane grill and a big yard.

  The kitchen has 2 refrigerators, an induction stovetop and room for everyone to help. Families get a crib, a high chair and stair gates, so little ones are covered too.
