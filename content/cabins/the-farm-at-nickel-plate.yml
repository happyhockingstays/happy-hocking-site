faqs:
  - q: What's in the sports barn?
    a: A big indoor space for basketball, pickleball, soccer and more. It's yours for the whole stay.
  - q: How many people does The Farm sleep?
    a: 22 guests across 8 bedrooms, with 7 king beds, 4 queen beds and a crib. There are 5.5 baths.
  - q: Is the pool heated?
    a: No. The pool is open May 15 to October 15. The hot tub seats 6 and is open all year.
  - q: How far is The Farm from the Hocking Hills trails?
    a: About 20 to 30 minutes. Downtown Logan is 10 minutes away.
  - q: What time are check-in and check-out?
    a: Check-in is 4:00 pm and check-out is 11:00 am.
  - q: Is there a minimum stay?
    a: 2 nights. Holiday and peak-season stays may need 3.
  - q: What is the cancellation policy?
    a: Full refund up to 60 days before check-in and 50% up to 30 days before. After that, stays are non-refundable.
