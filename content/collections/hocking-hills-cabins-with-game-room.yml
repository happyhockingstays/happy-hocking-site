faqHeading: Courts and game rooms, answered
faqs:
  - q: Which cabins have a pickleball court?
    a: Pickle Hill, The Farm at Nickel Plate and Lazy Deer Retreat. Pickle Hill has
      a regulation pickleball court inside its own barn. The Farm has a sports
      barn for pickleball, basketball and soccer, and Lazy Deer has a sport
      court for pickleball and basketball. They're vacation rentals with
      pickleball courts you don't share with anyone.
  - q: What's in the game rooms?
    a: It depends on the cabin. The Farm at Nickel Plate has a pool table, air
      hockey, foosball, ping pong and video games. Lazy Deer Retreat has
      shuffleboard and arcade games, Rickenbacker Ridge has foosball and air
      hockey, and Dunkle Creek has shuffleboard. Each cabin game room is shown
      in the photos on its page.
  - q: Are these family friendly cabins with game rooms?
    a: Yes. These are family friendly cabins with game rooms that work for kids,
      teens and grandparents, with board games and yard games next to the pool
      tables and arcade machines. The Farm at Nickel Plate also has a crib, a
      high chair, stair gates and a swing set.
  - q: Can we play pickleball if it rains?
    a: Yes, at Pickle Hill and The Farm at Nickel Plate. Pickle Hill's regulation
      court is inside an enclosed barn, and The Farm's court is inside its
      sports barn, so rain doesn't stop the game. Pickle Hill's barn is covered
      but isn't heated or cooled, so dress for the season.
  - q: Is it cheaper to book a pickleball cabin direct?
    a: Yes. If you found Pickle Hill on Airbnb or Vrbo, it's the same cabin here,
      with the same hosts. Booking direct costs less because you skip the
      booking-site service fees, and your reservation comes straight to us. The
      same goes for all our pickleball vacation rentals.
