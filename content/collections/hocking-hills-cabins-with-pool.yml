faqHeading: Pool questions, answered
faqs:
  - q: When are the pools open?
    a: Most of our Hocking Hills cabins with pools are open for swimming May 15 to
      October 15. Clouds Reach has the longest season, April 15 to November 30,
      because its saltwater pool is heated to about 85°F. Outside those dates
      the pools are closed, and every cabin's hot tub stays open all year.
  - q: Are any of the pools heated?
    a: Yes, 2 of them. Clouds Reach has a saltwater pool heated to about 85°F, and
      Rickenbacker Ridge has a pool heated to about 80°F. The pools at our other
      cabins aren't heated, so plan on a refreshing swim early and late in the
      season. Every cabin with a pool also has a hot tub, open all year.
  - q: Are the pools private?
    a: Yes. Each of our cabins with private pools has one pool for one group, and
      that group is yours. There are no shared hours and no other guests. That's
      the difference between a pool cabin and a lodge or hotel with a shared
      swimming pool. You never have to hunt for a free lounge chair, and the
      only people in the water are yours.
  - q: Which Hocking Hills cabin with pool is best for a big group?
    a: Valhalla Hills and Loch Llyn each sleep 29, and The Farm at Nickel Plate
      sleeps 22. Each one is a Hocking Hills cabin with pool, hot tub and fire
      pit in the same yard, so the whole group stays together. For 13 to 16
      people, look at Clouds Reach, The Johnny or Rickenbacker Ridge.
  - q: Do the cabins with swimming pools have hot tubs too?
    a: Yes. Every one of our cabins with swimming pools also has a hot tub and a
      fire pit. The pool is for the afternoon and the hot tub is for after dark.
      Hot tubs seat 4 to 8 depending on the cabin, and they stay open in the
      months when the pools are closed.
  - q: Which pools are saltwater?
    a: Valhalla Hills, Clouds Reach and Pickle Hill have saltwater pools. Of those,
      Clouds Reach is the one that's heated, to about 85°F. If saltwater matters
      to your group, start with those cabin rentals with a pool, then choose by
      size. Pickle Hill sleeps 10, Clouds Reach sleeps 16 and Valhalla Hills
      sleeps 29.
