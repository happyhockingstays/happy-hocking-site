faqHeading: Luxury cabin questions, answered
faqs:
  - q: What makes a cabin a luxury cabin?
    a: A luxury cabin gives your group things you'd otherwise share or go without.
      That means a private pool, a hot tub, real space and a kitchen that can
      feed everyone. At our cabins it also means privacy. Properties like Loch
      Llyn sit on 130 acres with a private lake, and Rickenbacker Ridge has 20
      wooded acres.
  - q: Which luxury cabin works for a smaller group?
    a: Lazy Deer Retreat sleeps 8 and Pickle Hill sleeps 10, so they're the easiest
      fit for a smaller group that still wants a luxury cabin rental. Both have
      a private pool, a hot tub and a sauna. Lazy Deer is about 5 minutes from
      Old Man's Cave, and Pickle Hill is 5 minutes from downtown Logan.
  - q: Do any of the luxury cabins have a heated pool?
    a: Yes. Clouds Reach has a saltwater pool heated to about 88°F and open April 15
      to November 30, and Rickenbacker Ridge has a pool heated to about 82°F and
      open May 15 to October 15. Every one of our luxury cabins also has a hot
      tub that's open all year.
  - q: How close are the luxury cabins to the trails?
    a: Most of our Hocking Hills luxury cabins are 25 to 30 minutes from Old Man’s
      Cave, and Lazy Deer Retreat is about 5 minutes away. Every cabin page
      lists exact drive times to Old Man’s Cave, Ash Cave, Cedar Falls and Lake
      Logan.
  - q: Is it cheaper to book a luxury cabin direct?
    a: Yes. Booking direct costs less than booking the same cabin on a booking site,
      because you skip the booking-site service fees. On a large luxury cabin,
      that difference adds up. You get the same cabin and the same hosts, and
      your reservation comes straight to us.
