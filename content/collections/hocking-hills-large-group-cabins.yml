faqHeading: Good to know before you book for a group
faqs:
  - q: How many people can your largest cabins sleep?
    a: Valhalla Hills and Loch Llyn each sleep 29, which makes them our biggest
      cabin rentals for large groups. Valhalla Hills has 11 bedrooms and Loch
      Llyn has 10. The Farm at Nickel Plate sleeps 22 in 8 bedrooms. Every cabin
      has a maximum guest count, listed on its page.
  - q: Which cabin is best for a family reunion?
    a: For a family reunion of 20 to 29, start with Valhalla Hills or Loch Llyn.
      Both have 2 full kitchens and several living areas, so 3 generations can
      share a large cabin without sharing every minute. For 16 to 22 people,
      look at The Farm at Nickel Plate, Clouds Reach, or The Johnny.
  - q: Can we host a wedding or a party at a large cabin?
    a: No. Our cabins are group vacation rentals for overnight stays, not event
      venues. Weddings, parties and other events aren't allowed, and each cabin
      has a maximum guest count. Family reunions, trips with friends and
      vacations shared by 2 or 3 families are what these large group cabin
      rentals are for.
  - q: Do the big cabins have more than 1 kitchen?
    a: Valhalla Hills and Loch Llyn do. Valhalla Hills has 2 full kitchens with 3
      ovens and 2 dishwashers, and Loch Llyn has 2 full kitchens with 3
      refrigerators and 3 ovens. Our other large cabins have 1 fully equipped
      kitchen. The Farm at Nickel Plate adds a second refrigerator and a mini
      fridge.
  - q: How far ahead should a large group book?
    a: As early as you can. Calendars are usually open about a year out, and a large
      group needs more schedules to line up than a small one. Pick 2 or 3
      weekends that could work, check them on the cabin's page, then book the
      one the most people can make.
  - q: How do large groups split the cost?
    a: One person books and pays, and most groups settle up among themselves. You
      can pay in up to 3 installments that line up with the cancellation policy,
      which gives everyone time to send their share. Booking direct also skips
      the booking-site service fees, so there's less to split.
