steps:
  eyebrow: How we get started
  heading: 3 steps to hands-off
  intro: No big commitment to find out if we're a fit. Start with a conversation.
  items:
    - title: Intro call
      text: Tell us about your home and what you want from it.
    - title: Walkthrough and plan
      text: If it looks like a fit, we tour the home and map out pricing, setup and launch.
