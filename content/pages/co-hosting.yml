threeThings:
  heading: 3 things we do really well
  items:
    - title: Keep it booked
      text: Smart pricing, a managed calendar and listings that sell. Guests can also book your home direct, right here.
    - title: Keep it spotless
      text: A thorough clean after every stay, with the pool, hot tub and repairs looked after between guests.
    - title: Keep it off your plate
      text: We answer guests, typically within an hour. You get a clear statement every month.
services:
  eyebrow: What we handle
  heading: Hocking Hills property management, start to finish
  intro: Short-term rental management in Ohio, run the same way as every cabin on this site. Your home stays booked, spotless and well looked after.
  items:
    - icon: message
      title: Guest booking
      text: Inquiries, reservations and guest questions, handled by a team that answers fast.
    - icon: sparkle
      title: Professional housekeeping
      text: Every stay ends in a thorough clean, so every guest arrives to a spotless home.
    - icon: calendar
      title: Reservation management
      text: Dynamic pricing and calendar management to keep your nights booked at the right rate.
    - icon: wrench
      title: Maintenance
      text: Pool, hot tub, repairs and seasonal upkeep, scheduled and followed through.
    - icon: camera
      title: Marketing, design and photography
      text: Polished listings, professional photos and a direct-booking site that sells your home.
    - icon: chart
      title: Monthly owner statements
      text: A clear report every month, so you always know how your home is performing.
ownership:
