testimonials: []
form:
  eyebrow: Get in touch
  heading: Let's talk about your home
  text: Tell us a little about the home and we'll set up an intro call.
faqs:
  - q: What does co-hosting include?
    a: Guest booking and messaging, professional housekeeping, reservation and pricing management, maintenance, plus marketing, design and photography.
  - q: How much does it cost?
    a: Every home is different, so we go over fees on your intro call and build a plan that fits yours. Your listing stays in your name and booking payments go straight to you. We bill you from there.
  - q: Which areas of Ohio do you cover?
    a: We offer vacation rental management in Ohio's Hocking Hills area, including Logan, Lancaster, Laurelville, Sugar Grove and McArthur. Have a home somewhere else nearby? Reach out and we'll tell you if we can help.
  - q: Do I need to live nearby?
    a: No. We handle everything on site, and you get a statement every month so you always know how your home is doing.
  - q: How do I get started?
    a: Send us a note with the form on this page. We'll set up an intro call, then a walkthrough of your home.
