hero:
  eyebrow: About us
  heading: The crew behind Happy Hocking Stays
  intro: Happy Hocking Stays is a locally run vacation rental company in Ohio's Hocking Hills. Guests book private cabins with pools, hot tubs and room for every kind of group, direct at happyhocking.com. Homeowners hand us the hosting, from guest messages and pricing to cleaning and upkeep, and get hands-off income.
