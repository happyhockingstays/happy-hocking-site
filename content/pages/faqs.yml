intro: Quick answers about booking, the cabins and your stay. Can't find yours?
  Send us a note.
groups:
  - title: Booking direct
    items:
      - q: How do I book direct?
        a: Pick your dates on any cabin's page and book instantly. Payment and your
          rental agreement are all handled online.
        home: true
      - q: Is it really cheaper to book direct?
        a: Yes! Booking direct skips the high booking-site service fees from Airbnb and
          VRBO. Same cabins, same team, and your reservation goes straight to
          us.
        home: true
      - q: How do payments work?
        a: "Most major credit cards are accepted. You can pay in full when your booking
          is accepted, or split it into 3 payments: the first at booking, the
          second 60 days before check-in, and the final payment 30 days before
          check-in. Some of our larger homes, like Valhalla Hills and Loch Llyn
          use 90 and 60 days before check in. Your exact amounts and dates
          appear at checkout."
        home: false
      - q: Do I sign a rental agreement?
        a: Yes. Every direct booking comes with a rental agreement, and you sign it
          online.
        home: false
      - q: How far ahead can I book?
        a: Most calendars are open about a year ahead, and it can vary by cabin. Pick
          your dates on any cabin’s page to see what’s available. If your dates
          aren’t open yet, join our insider list and we’ll let you know when
          they are.
        home: false
  - title: Choosing a cabin
    items:
      - q: Which cabin is right for my group?
        a: Our cabins sleep 6 to 29, from cozy A-frames for couples to big estates for
          the whole crew. Tell us your group size and we’ll point you to the
          right fit, or browse all cabins and check the sleeps count on each
          one.
        home: true
      - q: How close are the cabins to the caves and trails?
        a: Most are 20 to 30 minutes from the main Hocking Hills trails, and Lazy Deer
          Retreat is about 5 minutes from Old Man's Cave. Each cabin's page
          lists drive times.
        home: true
      - q: Do all your Hocking Hills cabins have a pool and hot tub?
        a: Most of our cabins have a private pool, and all have a private hot tub. Each
          cabin’s page lists exactly what’s included. Use the pool filter on our
          cabins page to see which cabins have one.
        home: true
      - q: Which cabins are best for games and sports?
        a: Pickle Hill has a regulation pickleball court in its own barn. The Farm at
          Nickel Plate has a sports barn for basketball, pickleball and soccer.
          Lazy Deer Retreat has a sport court outside for pickleball and
          basketball.
        home: false
      - q: When are the pools open?
        a: Pools are seasonal. Most are open from mid-May to mid-October, and Clouds
          Reach opens earlier and stays open later. Hot tubs are open all year.
          Exact dates are on each cabin’s page.
        home: false
      - q: Are the pools heated?
        a: "The pools at Clouds Reach and Rickenbacker Ridge are heated, and the rest
          are not. Heated pools are marked on each cabin’s page. "
        home: false
  - title: Your stay
    items:
      - q: What time are check-in and check-out?
        a: Check-in is 4:00 pm. Check-out is 11:00 am, or 10:00 am at Valhalla Hills and
          Loch Llyn. Your booking confirmation lists the times for your cabin.
        home: false
      - q: Is there a minimum stay?
        a: Most dates have a 2-night minimum at every cabin. Holidays and peak season
          may need 3 nights or more. Pick your dates on a cabin’s page to see
          the minimum for your stay.
        home: false
      - q: When do I get the address and check-in details?
        a: "The exact address comes with your booking confirmation, and check-in details
          land in your inbox approximately 7 days before your arrival. "
        home: false
      - q: How old do I need to be to book?
        a: We kindly prefer the booking guest to be 25 or older. Discreet exceptions are
          made for younger guests.
        home: false
      - q: Are pets allowed?
        a: No. Pets aren't allowed at any of our cabins.
        home: false
  - title: Policies
    items:
      - q: What is your cancellation policy?
        a: Most cabins offer a full refund up to 60 days before check-in and 50% up to
          30 days before. Valhalla Hills and Loch Llyn use 90 and 60 days. Full
          details are on each cabin's page.
        home: true
      - q: What are the house rules?
        a: A few apply to every stay. No pets, no smoking and no parties or events. Each
          cabin also has a maximum guest count. The full list is on each cabin's
          page.
        home: false
      - q: Are there quiet hours?
        a: Yes, at most cabins. They usually start at 10:00 pm. At Valhalla Hills,
          outdoor quiet hours run 9:00 pm to 9:00 am, with no outdoor speakers.
          Each cabin's page has its own.
        home: false
