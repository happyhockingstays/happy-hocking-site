cabins:
  eyebrow: Our cabins
  intro: Our Hocking Hills cabins run from a cozy A-frame for 6 to a lake estate
    for 29, each with a private pool and hot tub. Pick the one that fits your
    crew.
story:
  eyebrow: Meet your hosts
  heading: The crew behind your stay
  text: We’re a small local team, and we look after every cabin ourselves. You’ll
    arrive to a spotless home, get quick answers, and always reach a real
    person.
  linkLabel: Meet the team
  image: /images/uploads/dave-and-natalie.jpg
  alt: Dave Hughes and Natalie Chadwell, the hosts of Happy Hocking Stays
reviews:
  intro: Hosts who answer fast, homes that are spotless and guests who come back.
cohost:
  eyebrow: Co-hosting for homeowners
  heading: Own a Hocking Hills vacation home? We’ll run it.
  text: "We manage your vacation home from start to finish: listing, pricing,
    guest messaging, cleaning and maintenance. You keep the listing and the
    income."
  points:
    - Cleaning, guest support and maintenance, handled
    - Your listing stays in your name
    - Booking payments go straight to you
    - A clear statement every month
  image: /images/cabins/loch-llyn/living-room/loch-llyn-living-room-001.jpg
  alt: Living room at Loch Llyn with a 2-story stone fireplace
area:
  eyebrow: The Hocking Hills
  heading: Trails by day, hot tub by night
  text: Most of our cabins are 20 to 30 minutes from Old Man’s Cave, Ash Cave and
    Cedar Falls, so you can hike all day and be back at your hot tub by sunset.
  linkLabel: Read the area guides
  image: /images/cabins/loch-llyn/lake/loch-llyn-lake-004.jpg
  alt: Trees reflected in the private lake at Loch Llyn
faqs:
  eyebrow: FAQs
  heading: Good to know
closing:
  heading: Find your happy place
  text: Choose your cabin, pick your dates and book direct. Same cabins, no
    booking-site fees, and a team that answers fast.
