updated: 2026-11-15
intro: This page explains what information Happy Hocking Stays collects on happyhocking.com, why we collect it and what you can ask us to do with it. We keep it short and plain on purpose.
sections:
  - heading: What we collect
    text: |-
      When you send us a question, a co-hosting inquiry or a review, we collect what you type into the form. That's usually your name, your email, your phone number if you share it, the dates or home you're asking about and your message.

      When you join the insider list, we collect your email address.

      Like most websites, ours also records basic visit details, such as the pages you open, the kind of device and browser you use and roughly where you're visiting from.
  - heading: Bookings and payments
    text: |-
      Bookings on this site run through Hospitable, our booking system. When you book, Hospitable collects your contact details, your stay details and your payment, then shares your reservation with us so we can host you.

      Card payments are processed by Hospitable and its payment provider, not on this website.
  - heading: How we use it
    text: |-
      We use your information to answer you, to manage your stay, to send insider list emails if you signed up for them and to make the website better.

      We don't sell your personal information.
  - heading: Who we share it with
    text: |-
      We share information only with the services that help us run the site and host your stay: Hospitable for bookings, Netlify for hosting and forms, Mailchimp for the insider list and Google for visit statistics. Each one handles information under its own privacy policy.

      We may also share information when the law requires it.
  - heading: Cookies and similar tools
    text: |-
      The site may use cookies and small scripts from Mailchimp and Google. They show the insider list signup, connect a visit to an email we sent you and count how many people visit each page.

      You can block or clear cookies in your browser settings. The site still works without them.
  - heading: Reviews
    text: If you send us a review, we may publish your first name, the month of your stay, your ratings and your public comment. We never publish your email address or your private feedback.
  - heading: Your choices
    text: |-
      Every insider list email has an unsubscribe link, and it works right away.

      You can ask us what information we have about you, ask us to correct it or ask us to delete it. Send us a note and we'll take care of it.
  - heading: Children
    text: This site is for adults planning a stay. We don't knowingly collect information from children under 13.
  - heading: Changes to this page
    text: If we change how we handle information, we'll update this page and the date at the top.
